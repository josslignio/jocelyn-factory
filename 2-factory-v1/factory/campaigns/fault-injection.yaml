  - id: F008
    title: reviewer écrit dans le repo
    status: PASS
    mechanism: factory/bin/factoryctl.py::Factory.verify_runtime
    real_gap_found_and_fixed: >
      workspace_tree_before/workspace_tree_after in verify_runtime() were computed with plain
      `git status --porcelain`, which silently omits any write to a path matched by the product
      repo's own `.gitignore`. An oracle/reviewer process could write real content anywhere under
      a gitignored path (e.g. `__pycache__/`) inside the disposable clean-room worktree and the
      tree-identity check never noticed — order §9's explicit reviewer-write prohibition and its
      `REVIEWER_WRITE_VIOLATION` fail-closed guarantee were bypassed by anything landing on a
      gitignored path, exactly the "reviewer écrit dans le repo" shape this fault names. Fixed
      two parts together: (1) tree_before/tree_after now use `--ignored` so any mutation, tracked
      or not, is caught; (2) `clean_env` now sets `PYTHONDONTWRITEBYTECODE=1` and
      `PYTEST_ADDOPTS=-p no:cacheprovider` so a legitimate oracle run — which routinely creates
      `__pycache__`/`.pytest_cache` as a harmless byproduct of running pytest — does not falsely
      trip the newly-widened check. Switching to `--ignored` alone, without this suppression,
      would have broken every real verify_runtime call, including the ones already proven for
      F001-F007.
    tested_by:
      - tests/test_fault_f008_reviewer_writes_ignored_file.py::test_reviewer_write_to_gitignored_path_is_caught
      - tests/test_fault_f008_reviewer_writes_ignored_file.py::test_legitimate_pytest_oracle_run_still_passes
    red_before_fix: >
      test_reviewer_write_to_gitignored_path_is_caught failed against the pre-fix code (confirmed
      live via `git stash` of `factoryctl.py` alone: a real oracle wrote a file into a gitignored
      `__pycache__/` path in the disposable worktree and verify_runtime() reported a clean run
      with no violation raised) before the fix was applied.
    full_suite: 152 passed -> 154 passed (2 new), zero regressions
    real_limitation: >
      Proves the fix against a synthetic single-milestone fixture with a real git repo/worktree/
      oracle; does not retroactively re-verify already-accepted historical runtime receipts
      (JR-M1..M5 etc.), unaffected by design since verify_runtime() is only invoked at build/qa/
      sha time going forward, same precedent as F001/F005/F006/F007.
  - id: F009
    title: SHA divergent
    status: PASS
    mechanism: factory/bin/factoryctl.py::Factory._require_runtime_sha_agreement
    real_gap_found_and_fixed: >
      _require_runtime_sha_agreement (JR-LIVE-RECOVERY Phase 9.5) only rejected a *disagreement*
      between recorded {provider}_runtime_sha fields and candidate_sha. When NO provider had
      ever actually run verify_runtime, the disagreement set was empty and the check passed
      vacuously. Combined with _require_runtime_receipt accepting an inline runtime_receipt
      typed directly into the qa/sha artifact — never required to have been produced by a real
      verify_runtime() call, since every field validate_runtime_receipt() checks (candidate_sha,
      acceptance_lock_sha256, oracle_sha256, mission_id) is independently computable by anyone
      with read access to the product repo, as F001's own positive-control test already
      demonstrates (a hand-computed oracle_sha256 is sufficient) — a milestone could reach
      sha_accepted AND pass promote()'s independent pre-merge gate on a 100% self-declared
      receipt where the accepted SHA never actually agreed with any independently-executed
      provider review at all. Fixed: whenever the milestone opted into the runtime-oracle
      contract (acceptance_lock_sha256 set), the check now also fails closed if no canonical
      provider (builder/z/codex) has recorded a matching runtime SHA — not just if one disagrees.
    tested_by:
      - tests/test_fault_f009_sha_divergent.py::test_sha_accepted_reachable_on_never_executed_receipt_real_gap
      - tests/test_fault_f009_sha_divergent.py::test_promote_also_rejects_when_no_provider_ever_ran
      - tests/test_fault_f009_sha_divergent.py::test_single_real_verify_runtime_run_is_sufficient
      - tests/test_fault_f009_sha_divergent.py::test_real_cross_provider_divergence_already_caught_end_to_end
    red_before_fix: >
      test_sha_accepted_reachable_on_never_executed_receipt_real_gap and
      test_promote_also_rejects_when_no_provider_ever_ran both failed against the pre-fix code
      (confirmed live: record("M1","sha",...) reached sha_accepted, and promote() printed a real
      merge SHA, with zero providers having ever run verify_runtime) before the fix was applied.
      test_single_real_verify_runtime_run_is_sufficient and
      test_real_cross_provider_divergence_already_caught_end_to_end already passed pre-fix,
      confirming the pre-existing cross-provider mismatch check was already correctly wired for
      the case where providers DO run verify_runtime (same precedent as F002).
    full_suite: 154 passed -> 158 passed (4 new), zero regressions
    real_limitation: >
      Proves the fix on a synthetic single-milestone fixture with a real git repo/worktree/
      oracle via Factory.record/verify_runtime/promote directly; does not retroactively re-check
      the one already-accepted lock=True milestone in this repo (csv-statistics M1, retro_done)
      — confirmed unaffected before applying the fix: it already has a real builder_runtime_sha
      recorded that matches its candidate_sha, so the new check would pass for it unchanged.
      Does not close the deeper, separate gap that an inline runtime_receipt's declarative
      true/false fields (downloads_passed, cv_personalization_pass, etc.) are still never
      independently verified against a real oracle run when at least one provider's SHA happens
      to agree — that is a distinct "faux receipt" concern (F001's territory), out of scope here.
  - id: F010
    title: deux sorties identiques
    status: PASS
    mechanism: factory/bin/factoryctl.py::Factory.record (kind=="build")
    real_gap_found_and_fixed: >
      When a qa/sha verdict rejects a candidate, record() sends the milestone back to
      plan_accepted with repairs incremented (order: at most 2 repairs before blocked), expecting
      the builder to produce a genuinely fixed candidate. The build branch only ever checked that
      the submitted exact_sha matched the worktree's actual git HEAD — it never compared the new
      candidate against the previously-rejected one. A builder that resubmitted a build artifact
      without having committed any real fix (worktree HEAD unchanged since the rejection) had the
      exact same, already-rejected candidate_sha silently become the new "built" output again —
      burning one of the milestone's two repair attempts on unchanged code, gambling that a
      stochastic/lenient reviewer would accept it on a second look. Two identical build outputs
      (pre- and post- "repair") were indistinguishable from a genuine fix. Fixed: the build branch
      now fails closed with INVALID_REVIEW if repairs>0 (a repeat build after a rejection) and the
      newly submitted exact_sha equals the milestone's own previously-recorded candidate_sha.
    tested_by:
