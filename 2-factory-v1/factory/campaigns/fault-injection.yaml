      historical milestones (already retro_done/committed under the old code path).
  - id: F005
    title: oracle modifié après lock
    status: PASS
    mechanism: >
      factory/bin/factoryctl.py::Factory.mark_spec_ready (now pins oracle_sha256 from
      scripts/verify_live_product_dod.py at spec_ready time, when that file already exists) and
      Factory.record's "build" transition (now rejects a divergence between that pinned hash and
      the oracle's current on-disk hash, same rejection shape as the pre-existing
      acceptance.lock.json-changed check).
    real_gap_found_and_fixed: >
      acceptance.lock.json pins spec_sha256/plan_sha256/tasks_sha256/network_policy_sha256/
      toolchain_lock_sha256/negative_mutations — but never the oracle script's own hash. Both
      places that compute an "expected" oracle hash (_require_runtime_receipt at record-qa-time,
      and verify_runtime at receipt-production-time) always recompute it fresh from whatever is
      on disk (worktree HEAD / the exact candidate_sha respectively) — neither compares against
      anything pinned at spec_ready. An oracle edited and committed after mark_spec_ready (with
      acceptance.lock.json itself left untouched) was therefore silently re-baselined as the new
      "expected" oracle rather than rejected: the modified oracle produced a self-consistent,
      genuinely-passing receipt with no detectable divergence anywhere in the pipeline. Fixed by
      pinning oracle_sha256 at spec_ready (mirroring acceptance_lock_sha256) and checking it at
      build, the same stage/shape as the existing lock-changed check.
    tested_by:
      - tests/test_fault_f005_oracle_modified_after_lock.py::test_oracle_unchanged_since_lock_is_accepted_at_build
      - tests/test_fault_f005_oracle_modified_after_lock.py::test_oracle_modified_after_lock_is_rejected_at_build
      - tests/test_fault_f005_oracle_modified_after_lock.py::test_lock_without_oracle_present_at_spec_ready_is_unaffected
    red_before_fix: >
      test_oracle_unchanged_since_lock_is_accepted_at_build (KeyError: no oracle_sha256 pinned at
      all) and test_oracle_modified_after_lock_is_rejected_at_build (the weakened post-lock oracle
      reached "built" with no rejection) both failed against the pre-fix code, confirmed live via
      `git stash` of the factoryctl.py fix, before the fix was applied.
    full_suite: 141 passed -> 144 passed (3 new), zero regressions.
    real_limitation: >
      Proves the fix mechanically on a fresh single-milestone fixture driven through the real
      mark_spec_ready/record("plan")/record("build"), same rigor as F001-F004; does not re-drive
      the already-closed M1/M2 historical milestones (already retro_done/committed, and M1/M2's
      own real acceptance.lock.json files predate this fix so carry no oracle_sha256 — backward
      compatible per test_lock_without_oracle_present_at_spec_ready_is_unaffected, not silently
      tightened for them). Does not cover an oracle edited between build and qa/sha (a separate,
      narrower window already fail-closed today because verify_runtime pins its receipt to the
      exact immutable candidate_sha's disposable checkout, not the mutable worktree).
  - id: F006
    title: artefact modifié après receipt
    status: PASS
    mechanism: >
      factory/bin/factoryctl.py::Factory.verify_events (event log's own internal hash-chain
      check, pre-existing) and the new Factory.verify_evidence (cross-checks each event's
      pinned artifact_sha256, now stamped at write-time by both Factory.record and
      Factory.verify_runtime, against the referenced evidence file's current on-disk content).
    real_gap_found_and_fixed: >
      record() wrote each accepted artifact's bytes to self.evidence/<mid>/<name> and appended a
      hash-chained event referencing its *path* (evidence=str(dst)) — but never a hash of its
      *content*. verify_events() (the sole integrity check wired into status()) only proves the
      event log is internally self-consistent; it never re-derives anything from the evidence
      files those events point at. An already-accepted qa/sha artifact (or the pinned runtime-
      receipt file verify_runtime() writes) could be edited or deleted directly on disk after
      acceptance — after the receipt that earned it — with zero detection anywhere in the
      system's own tamper-evidence surface. Confirmed empirically before fixing: recorded a real
      qa artifact to qa_accepted, edited its evidence file's bytes directly, called
      verify_events() again — still reports a perfectly healthy chain. Fixed: record() and
      verify_runtime() now pin artifact_sha256 into their event's hash-chained meta at write-
      time; a new Factory.verify_evidence() (wired into status()) re-derives each referenced
      file's current hash and fails closed (TAMPERED_EVIDENCE) on any content divergence or
      disappearance.
    tested_by:
      - tests/test_fault_f006_artifact_modified_after_receipt.py::test_untampered_evidence_passes_verify_evidence
      - tests/test_fault_f006_artifact_modified_after_receipt.py::test_tampered_evidence_after_acceptance_is_detected
      - tests/test_fault_f006_artifact_modified_after_receipt.py::test_deleted_evidence_after_acceptance_is_detected
      - tests/test_fault_f006_artifact_modified_after_receipt.py::test_legacy_event_without_artifact_sha256_is_unaffected
      - tests/test_fault_f006_artifact_modified_after_receipt.py::test_runtime_receipt_tampering_after_verify_runtime_is_detected
    red_before_fix: >
      test_untampered_evidence_passes_verify_evidence, test_tampered_evidence_after_acceptance_is_detected,
      test_deleted_evidence_after_acceptance_is_detected, test_legacy_event_without_artifact_sha256_is_unaffected
      and test_runtime_receipt_tampering_after_verify_runtime_is_detected all failed against the
      pre-fix code (confirmed live via `git stash` of factoryctl.py alone: verify_evidence did
      not exist at all, and the in-test control assertion `f.verify_events()` — called twice,
      once before and once after tampering the evidence file — proved the pre-existing generic
      chain check stays silent throughout) before the fix was applied.
    full_suite: 144 passed -> 149 passed (5 new), zero regressions.
    real_limitation: >
      Proves the fix mechanically on synthetic single-milestone fixtures via the real
      Factory.record/Factory.verify_runtime/Factory.verify_evidence, same rigor as F001-F005;
      does not retroactively verify the already-closed M1/M2 historical evidence files (their
      events predate this fix and carry no artifact_sha256 — by design unaffected, proven by
      test_legacy_event_without_artifact_sha256_is_unaffected, not silently tightened for them).
      Only covers evidence files written through record()/verify_runtime() themselves — does not
      cover mark_spec_ready's spec_ready.json (out of scope for this fault ID; a narrower,
      separately-scoped candidate if ever needed, same "don't speculatively harden untested
      surfaces" precedent as F003/F005).
  - id: F007
    title: review sans runtime
    status: PASS
    mechanism: factory/bin/factoryctl.py::Factory.mark_spec_ready
    real_gap_found_and_fixed: >
      _require_runtime_receipt only enforces the runtime-receipt requirement at qa/sha when the
