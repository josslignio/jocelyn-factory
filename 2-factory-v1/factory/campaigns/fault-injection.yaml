  - id: F011
    title: crash mid-run
    status: PASS
    mechanism: factory/bin/factoryctl.py::Factory.prepare
    real_gap_found_and_fixed: >
      prepare() creates the milestone's persistent build worktree via `git worktree add -b
      <branch> <wt> <base>`, gated only by `if not wt.exists()`. Confirmed empirically with a
      real git repo: a crash between worktree creation and the worktree being fully usable (or
      an operator deleting a half-built worktree directory after a crash, to retry) leaves
      `refs/heads/factory/<mid>` committed in the product repo while `wt` itself is gone (`git
      worktree list` reports it `prunable`). A subsequent prepare() retry — exactly what the
      campaign driver's next iteration does — permanently wedges: `wt.exists()` is false again,
      so it re-attempts `git worktree add -b factory/<mid> ...`, which fails every time with "a
      branch named 'factory/<mid>' already exists" (`-b` always demands a brand-new branch). No
      automated recovery existed; the milestone was stuck forever without a manual `git branch
      -D`. This is the "crash mid-run" shape order §14 names.
    fix: >
      prepare() now runs `git worktree prune` before attempting creation (clears the stale
      administrative entry for a worktree directory that no longer exists), and if the branch
      already exists (the crash-recovery case) reuses it via `git worktree add <wt> <branch>`
      instead of `-b`, rather than unconditionally demanding a brand-new branch. A first-time
      prepare (branch does not exist yet) is unaffected.
    tested_by: tests/test_fault_f011_crash_mid_run.py
    red_before_fix: >
      test_crash_mid_run_worktree_lost_branch_survives_is_recovered failed against the pre-fix
      code (confirmed live: after simulating the crash — `git worktree remove --force` on the
      wt directory with the branch left intact — the retry raised "worktree creation failed" /
      "a branch named 'factory/m1' already exists", exactly reproducing the permanent wedge).
      test_first_prepare_never_affected_by_this_fix already passed pre-fix, confirming the fix
      only changes the crash-recovery path.
    full_suite: 161 passed -> 163 passed (2 new), zero regressions
    real_limitation: >
      Simulates the crash by deleting the worktree directory after a successful prepare() (the
      real, confirmed-empirically state a killed/deleted worktree leaves behind: branch survives,
      directory gone, git worktree list reports it prunable) rather than literally SIGKILLing the
      factoryctl process mid-`git worktree add`. Does not cover a crash mid-write of the roadmap
      JSONL itself (atomic_jsonl's tempfile+os.replace already makes that append atomic at the
      filesystem level, a separate mechanism from this worktree-creation gap). Does not exercise
      recovery through the full campaign-run orchestrator (order §7.5, not yet built).
