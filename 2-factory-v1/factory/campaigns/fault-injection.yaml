      - tests/test_fault_f004_other_campaign.py::test_receipt_from_another_mission_is_rejected
      - tests/test_fault_f004_other_campaign.py::test_receipt_missing_mission_id_entirely_is_rejected
    red_before_fix: >
      test_receipt_from_another_mission_is_rejected and
      test_receipt_missing_mission_id_entirely_is_rejected both failed against the pre-fix code
