  - id: F017
    title: port occupé
    status: PASS
    mechanism: factory/bin/factoryctl.py::Factory.verify_runtime
    real_gap_found_and_fixed: >
      verify_runtime() ran the committed oracle via a bare subprocess.run — no process-group
      isolation, no timeout. Order §15 (M4b Notes API, M4c Reminder Scheduler) commits products
      whose DoD oracle legitimately backgrounds a live server to drive e2e/Schemathesis checks
      against. If that oracle backgrounds its server and then exits — crashes, or simply doesn't
      wait for it — without ever writing the runtime receipt, verify_runtime() already correctly
      raised ("oracle produced no receipt"), but the backgrounded server process itself was never
      tracked or torn down: factoryctl only ever waited on the oracle's own pid, never the process
      tree it spawned, so the server kept running (and kept the port bound) after verify_runtime()
      returned. Order §14/§5.6's retry mechanism (infra_failure, 30s/120s/300s backoff) then
      retries verify_runtime() for the exact same milestone — and the retried oracle, trying to
      bind the same port for its own server, finds it already occupied by the factory's own
      leaked prior attempt: a self-inflicted "port occupé" with no automated recovery. Fixed: the
      oracle now runs via subprocess.Popen(..., start_new_session=True), putting it — and anything
      it Popen's without itself detaching — into one process group whose pgid equals the oracle's
      own pid. verify_runtime() now unconditionally tears down that whole group (SIGTERM then
      SIGKILL) on every path — success, failure, or timeout — before returning, so no
      oracle-spawned process can ever outlive the call. A genuinely hung oracle is now also
      bounded by ORACLE_TIMEOUT_SEC (1800s) and routed through the same infra_failure() retriable
      mechanism as F016, rather than blocking the factory process forever.
    tested_by:
      - tests/test_fault_f017_port_occupe.py::test_leaked_oracle_child_is_killed_by_verify_runtime
      - tests/test_fault_f017_port_occupe.py::test_normal_successful_oracle_run_unaffected
    red_before_fix: >
      Confirmed live (via git stash of only factory/bin/factoryctl.py, not narrated) against the
      pre-fix code before applying any fix: test_leaked_oracle_child_is_killed_by_verify_runtime
      failed — the leaky oracle's backgrounded child (bound to a real TCP port) was still holding
      that port ~1.1s after verify_runtime() returned, well before its own 6s sleep would have
      released it naturally, proving the leak. test_normal_successful_oracle_run_unaffected
      already passed pre-fix (the golden path was never broken, only the leak-cleanup was
      missing). Stash restored (git stash pop) immediately after confirming red, before writing
      anything further.
    full_suite: 183 passed (was 181 pre-fix baseline from F016 + 2 new F017 tests), zero regressions
    real_limitation: >
      Proves the leak/cleanup mechanically against a real backgrounded TCP-listening process in a
      real git fixture repo (no mocks, no M4 product built yet) — the general "an oracle can leak
      a process, and the factory must reap the whole group it ran the oracle in" shape, not a
      specific M4b/M4c live-server oracle implementation (none exists yet). It also does not
      itself prevent a real network-level "port occupied by something outside this factory
      process entirely" (an unrelated process on the host bound to the same fixed port) — that is
      a genuine environmental precondition failure the oracle's own bind() must fail closed on;
      this fix only guarantees the factory never causes that condition against itself via its own
      leaked prior attempts.
  - id: F018
    title: timeout réseau
    status: PASS
    mechanism: >
      factory/bin/factoryctl.py::validate_runtime_receipt, Factory._require_runtime_receipt,
      Factory.infra_failure
    real_gap_found_and_fixed: >
      Order §2 network_policy / order line 70: "Panne réseau externe → WAITING_INFRA
      (reason_code=LIVE_NETWORK_UNAVAILABLE), jamais PRODUCT_FAIL automatique." Each
      acceptance.lock.json carries a hashed network_policy (offline|loopback|allowlist); Job
      Radar's live canary profile is allowlist (real ATS/employer hosts, GET/HEAD only).
      validate_runtime_receipt() treated ANY receipt["exit_code"] != 0 as a review problem, and
      nothing anywhere ever read reason_code — so a receipt honestly reporting that the committed
      oracle itself ran correctly, against the exact candidate/lock/mission, but failed only
      because an external network call it depends on timed out or was unreachable, was
      indistinguishable from a genuine product defect or a forged receipt. It surfaced as a bare
      INVALID_REVIEW (implying tampering, which a network hiccup is not); had that check been
      absent instead, it would have fallen through to record()'s ordinary qa/sha verdict path and
      consumed one of the milestone's two repair attempts on an outage entirely outside the
      product's control — the exact "PRODUCT_FAIL automatique" order line 70 forbids. Fixed:
      validate_runtime_receipt() now exempts the exit_code!=0 check ONLY when the receipt also
      declares reason_code=LIVE_NETWORK_UNAVAILABLE — every other identity/anti-spoofing check
      (schema, candidate_sha, oracle_sha256, acceptance_lock_sha256, mission_id,
      toolchain_lock_sha256) still applies unconditionally, so a spoofed reason_code cannot
      bypass them. When a receipt clears every identity check but still declares that
      reason_code, _require_runtime_receipt() now routes it through the same infra_failure()
      mechanism (30s/120s/300s backoff, blocked_infra after 3 retries) used by F016/F017, instead
      of either INVALID_REVIEW or a repair-consuming rejection.
    tested_by:
      - tests/test_fault_f018_timeout_reseau.py::test_qa_stage_network_unavailable_routes_to_waiting_infra_real_gap
      - tests/test_fault_f018_timeout_reseau.py::test_sha_stage_network_unavailable_also_routes_to_waiting_infra
      - tests/test_fault_f018_timeout_reseau.py::test_genuine_product_failure_without_reason_code_still_invalid_review
