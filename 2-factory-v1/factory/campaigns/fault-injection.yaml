    tested_by:
      - tests/test_fault_f002_other_candidate_sha.py::test_stale_exact_sha_rejected_at_qa_stage
      - tests/test_fault_f002_other_candidate_sha.py::test_stale_exact_sha_rejected_at_sha_stage
      - tests/test_fault_f002_other_candidate_sha.py::test_replayed_old_candidate_receipt_with_spoofed_envelope_rejected
      - tests/test_fault_f002_other_candidate_sha.py::test_matching_current_candidate_is_accepted
    full_suite: 116 passed -> 120 passed (4 new), zero regressions
    real_limitation: >
      Proves the two candidate_sha guards mechanically on a synthetic two-commit milestone via
