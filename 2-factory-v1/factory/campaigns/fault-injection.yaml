      instead of INVALID_REVIEW or a repair-consuming rejection" shape, not a specific live
      oracle's own network-timeout detection logic (none exists yet, since no M4 live-server
      product or Job Radar live canary has been built). It does not itself implement the network
      call, timeout, or reason_code emission inside any oracle — that is each future live oracle's
