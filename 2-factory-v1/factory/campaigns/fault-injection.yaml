      _require_runtime_receipt now recomputes the expected toolchain hash fresh from the worktree
      at record-time and passes it through; verify_runtime() now stamps receipt["toolchain_lock_sha256"]
      from the disposable worktree's own toolchain-lock.json (never trusts a caller-supplied value,
      same "stamp what actually happened" reasoning as the F004 mission_id fix). A milestone with no
