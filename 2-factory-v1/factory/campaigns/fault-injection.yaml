  - id: F003
    title: autre attempt
    status: PASS
    mechanism: >
      factory/bin/factoryctl.py::Factory.prepare() (mints a fresh milestone_run_id on every
      call) and Factory.record()'s staleness check (rejects a submitted artifact whose
      milestone_run_id doesn't match the row's current one) — the mechanism a stale-attempt
      verdict/receipt replay must go through.
    real_gap_found_and_fixed: >
      The staleness check only fired when the *submitted* artifact happened to carry
      milestone_run_id at all (`if expected_run and data.get("milestone_run_id") and ...`).
      Real, already-committed qa/sha verdict artifacts (e.g.
      projects/csv-statistics/evidence/M1/m1_qa_artifact.json) never populate this field —
      only `plan` artifacts historically do — so a qa/sha artifact produced under a stale
      attempt (one prepare()d before the current one, e.g. a session-restart re-prepare) sailed
      through unchecked as long as it simply omitted milestone_run_id, exactly the shape real
      artifacts already use. Fixed: for kind in {qa, sha} specifically (the two stages that
      gate promotion via _require_runtime_receipt), milestone_run_id is now required to be
      present and match the row's current one whenever the row has one — fails closed instead
      of treating an absent field as "not stale". `test`/`build`/`plan`/`retro` behavior is
      unchanged (no evidence any of those are exposed to this replay shape).
    tested_by:
      - tests/test_fault_f003_other_attempt.py::test_current_attempt_run_id_is_accepted
      - tests/test_fault_f003_other_attempt.py::test_stale_attempt_run_id_is_rejected
      - tests/test_fault_f003_other_attempt.py::test_missing_milestone_run_id_is_currently_accepted_real_gap
    full_suite: 135 passed -> 138 passed (3 new), zero regressions
    red_before_fix: >
      test_missing_milestone_run_id_is_currently_accepted_real_gap failed against the pre-fix
      code (confirmed live: the artifact reached qa_accepted despite a second attempt already
      being prepared) before the fix was applied.
    real_limitation: >
      Proves the fix mechanically on a synthetic single-milestone fixture via Factory.record/
      Factory.prepare directly (same pattern as F001/F002); does not re-drive the already-closed
      M1/M2 historical milestones through this scenario. `test`/`build`/`plan`/`retro` kinds
      remain opt-in on this field (unchanged), since no real replay path through those specific
      kinds has been demonstrated — narrowing the fix to qa/sha keeps it bounded to the
      demonstrated gap rather than speculatively hardening every kind at once.
  - id: F004
    title: autre campaign ID
    status: PASS
    mechanism: >
      factory/bin/factoryctl.py::Factory.verify_runtime (sole authoritative receipt producer,
      now stamps receipt["mission_id"]=mid at production time) and
      Factory._require_runtime_receipt -> validate_runtime_receipt (now independently checks
      receipt.get("mission_id") against the mid being recorded against).
    interpretation_note: >
      This codebase has no first-class campaign_id per receipt (order §8's full field list,
      including campaign_id/project_id/mission_id, lives only in the dead/unwired
      factory/bin/runtime_receipt.py — D-35). Factory instances are scoped per (product repo,
      project state dir), and the only real replay-target axis the live record() gate exposes is
      mission/milestone identity (mid) — so this scenario is proven as "receipt from another
      mission/capability replayed against a different one", the concrete, mechanically-testable
      form order §8's own rejection list names ("receipt d'une autre campagne/mission/attempt/
      SHA") in this architecture, same kind of terminology-to-real-architecture resolution
      documented for M2.3 (D-33).
    real_gap_found_and_fixed: >
      candidate_sha, acceptance_lock_sha256 and oracle_sha256 can all genuinely coincide across
      two DIFFERENT missions in this campaign (a shared "invariants" oracle reused across
      capabilities per order §17, and HEAD frequently unchanged between successive milestone
      prepares in this single-writer campaign) — none of those three checks ties a receipt to
      which mission actually earned it. A receipt legitimately produced by verify_runtime for
      mission M1 was accepted, unmodified, as mission M2's own qa proof, even though M2's own
      verify_runtime was never run. Fixed: verify_runtime stamps mission_id=mid on every receipt
      it produces (the one place receipts are authoritatively created — never trusts a
      caller-supplied value); validate_runtime_receipt now rejects a mismatched or absent
      mission_id whenever the caller (record-time, which always knows its own mid) supplies one
      to check against.
    tested_by:
