      when specs/<mid>/acceptance.lock.json happened to exist on disk — silently treating a
      missing lock file as an opt-out rather than the order rule 4 violation it actually is. A
      milestone that simply never committed acceptance.lock.json could reach qa_accepted/
      sha_accepted on a bare declarative verdict with the real committed oracle never executed
      once — exactly the "review sans runtime" = INVALID_REVIEW shape order rule 10 forbids.
      Fixed: mark_spec_ready now fails closed (same shape as its pre-existing missing/
      incomplete/placeholder spec/plan/tasks checks) when acceptance.lock.json does not exist,
      instead of silently treating it as legacy opt-out. Only affects future calls to
      mark_spec_ready — does not retroactively touch already spec_ready/retro_done milestones
      (JR-M1..M5, csv-statistics M1, SMOKE1), which never call it again.
    tested_by:
      - tests/test_fault_f007_review_without_runtime.py::test_milestone_without_acceptance_lock_at_spec_ready_is_rejected
      - tests/test_fault_f007_review_without_runtime.py::test_bare_declarative_qa_verdict_is_rejected_once_lock_is_required
      - tests/test_fault_f007_review_without_runtime.py::test_milestone_with_lock_present_is_unaffected
    red_before_fix: >
      test_milestone_without_acceptance_lock_at_spec_ready_is_rejected and
