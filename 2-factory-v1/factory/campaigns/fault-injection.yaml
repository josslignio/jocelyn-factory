scenarios:
  - id: F001
    title: faux receipt
    status: PASS
    mechanism: factory/bin/factoryctl.py::Factory._require_runtime_receipt
    real_gap_found_and_fixed: >
      _require_runtime_receipt called validate_runtime_receipt() without
      expected_oracle_sha256, so a forged runtime_receipt with candidate_sha and
      acceptance_lock_sha256 both correct (both public/derivable from the commit) but a
      fabricated non-empty oracle_sha256 passed the qa/sha gate without the real committed
      oracle ever running — a genuinely exploitable "faux receipt" path, not a hypothetical.
      Fixed: _require_runtime_receipt now independently re-derives the real oracle hash from
      the milestone's own worktree at record-time (scripts/verify_live_product_dod.py) and
      pins the receipt to it, same as verify_runtime() already does at receipt-production
      time; fails closed if the worktree/oracle is missing.
    tested_by:
      - tests/test_fault_f001_faux_receipt.py::test_forged_oracle_sha256_is_rejected
      - tests/test_fault_f001_faux_receipt.py::test_real_oracle_sha256_is_accepted
      - tests/test_fault_f001_faux_receipt.py::test_sha_stage_also_rejects_forged_oracle
      - tests/test_fault_f001_faux_receipt.py::test_missing_receipt_entirely_is_rejected
      - tests/test_fault_f001_faux_receipt.py::test_wrong_candidate_sha_in_receipt_is_rejected
      - tests/test_fault_f001_faux_receipt.py::test_missing_worktree_oracle_fails_closed
    red_before_fix: >
      test_forged_oracle_sha256_is_rejected, test_sha_stage_also_rejects_forged_oracle and
      test_missing_worktree_oracle_fails_closed all failed against the pre-fix code (confirmed
      live, not narrated, before applying the fix).
    full_suite: 110 passed -> 116 passed (6 new), zero regressions
    real_limitation: >
      Proves the qa/sha gate mechanically on a synthetic milestone via Factory.record directly;
      does not re-run this against the already-closed M1/M2 historical milestones (already
      retro_done/committed, unaffected by this forward-looking fix).
  - id: F002
    title: autre candidate SHA
    status: PASS
    mechanism: >
      factory/bin/factoryctl.py::Factory.exact (outer verdict envelope's exact_sha, checked at
