    full_suite: 188 passed (was 183 pre-fix baseline from F017 + 5 new F018 tests), zero regressions
    real_limitation: >
      Proves the receipt-classification gate mechanically (real git fixture repo, no mocks, no
      M4b/M4c/Job-Radar-live-canary oracle built yet) — the general "a receipt can honestly
