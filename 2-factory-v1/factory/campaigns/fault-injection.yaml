      Proves the nonce-replay ledger mechanically against real on-disk events.jsonl for the
      generic factory-runtime-receipt/v1 validator (runtime_receipt.py) — the schema order §7.3/
      §8 actually specifies run_nonce/idempotency_key for. factoryctl.py's own production receipt
      gate (RUNTIME_RECEIPT_SCHEMA="job-radar-runtime-receipt/v1", the legacy/product-specific
      validator explicitly left untouched per runtime_receipt.py's own docstring and the
      zero-regression rule) carries no run_nonce field at all and is unaffected by this fix; that
      pipeline's own replay exposure was independently re-examined this session and found to
      already be closed by the existing candidate_sha/mission_id/status-machine checks (F001/
      F004/F010 fixes) — a receipt cannot be replayed across a repair cycle (candidate_sha moves)
      or across milestones (mission_id pinned) or twice for the same mid+kind (the status machine
      itself blocks re-entering an already-passed transition). This session's fix specifically
      closes the one real, currently-exploitable gap: runtime_receipt.py's own documented
      replay-protection contract had no way to be honored by any real caller. Does not yet wire
      this generic validator into any live product pipeline (no M1-M5 product has been built
      yet that uses it) — same "not yet wired to a real pipeline" scope note as F023's
      writer_switch.py.
  - id: F022
    title: policy réseau modifiée
    status: PASS
    mechanism: factory/bin/factoryctl.py::mark_spec_ready, ::record (build branch),
      ::validate_runtime_receipt, ::_require_runtime_receipt
    gap_found: >
      Each acceptance.yaml carries a hashed network_policy (order line 70/82: mode
      offline/loopback/allowlist, allowed_hosts, etc.), and the runtime-receipt schema (order
      §7.3) lists network_policy_sha256 among its minimum fields. lock_acceptance.py already
      computes this hash as evidence at lock-cutting time, exactly like it does for
      toolchain_lock_sha256 (F015) and the oracle (F005) — but nothing downstream ever pinned it
      onto the roadmap row, and validate_runtime_receipt had no expected_network_policy_sha256
      parameter at all. Two real, exploitable consequences: (1) acceptance.yaml's network_policy
      could be edited after spec_ready (e.g. offline loosened to allowlist) without touching
      acceptance.lock.json itself — acceptance.lock.json only stores the policy's hash, not the
      raw policy, so the existing acceptance_lock_sha256 file-hash check at build never noticed;
      (2) a runtime receipt could declare an arbitrary/fabricated or entirely absent
      network_policy_sha256 and validate_runtime_receipt would never notice — the exact same
      "toolchain différente" (F015) gap shape, but for the network policy.
    fix: >
      mark_spec_ready now pins network_policy_sha256 (sha256 of the real acceptance.yaml
      network_policy dict, same hash function lock_acceptance.py uses) onto the roadmap row when
      present. record(..., "build", ...) now rejects (INVALID_REVIEW, "policy réseau modifiée")
      if the committed acceptance.yaml's current network_policy hash has drifted since that pin.
      validate_runtime_receipt gained expected_network_policy_sha256 and rejects a receipt whose
      declared network_policy_sha256 doesn't match. The receipt-time check is deliberately keyed
      off the row's pinned value (from mark_spec_ready), not a fresh worktree re-read at
      record-time — unlike expected_oracle_sha256/expected_toolchain_lock_sha256, which recompute
      fresh — so a post-lock tamper is judged against the LOCKED contract, not the tampered one,
      and it never collides with F019's separate fresh-read of network_policy.mode for the
      reason_code exemption (F018/F019's own fixtures never call mark_spec_ready with a
      network_policy present, so they stay entirely unaffected).
    tested_by:
      - tests/test_fault_f022_policy_reseau_modifiee.py::test_spec_ready_pins_network_policy_hash
      - tests/test_fault_f022_policy_reseau_modifiee.py::test_network_policy_unchanged_receipt_matching_is_accepted_at_qa
      - tests/test_fault_f022_policy_reseau_modifiee.py::test_network_policy_modified_after_lock_is_rejected_at_build
      - tests/test_fault_f022_policy_reseau_modifiee.py::test_fabricated_network_policy_hash_in_receipt_is_rejected_at_qa
      - tests/test_fault_f022_policy_reseau_modifiee.py::test_receipt_missing_network_policy_field_is_rejected_at_qa
      - tests/test_fault_f022_policy_reseau_modifiee.py::test_no_network_policy_at_spec_ready_is_unaffected
    red_before_fix: >
      Confirmed live before applying any fix (git stash of just the factoryctl.py addition, test
      file present, no mocks): test_spec_ready_pins_network_policy_hash,
      test_network_policy_modified_after_lock_is_rejected_at_build,
      test_fabricated_network_policy_hash_in_receipt_is_rejected_at_qa, and
      test_receipt_missing_network_policy_field_is_rejected_at_qa all failed (4/6), proving
      neither the pin, the build-time drift check, nor the receipt-level check existed anywhere.
      The 2 that passed pre-fix (matching-hash positive control, no-policy-at-spec_ready
      backward-compat control) were expected to be unaffected either way.
    full_suite: 197 passed (F021 baseline) → 203 passed (6 new F022 tests), zero regressions
    real_limitation: >
      Proves the network-policy lock/drift/receipt-tamper mechanism mechanically against real
      on-disk acceptance.yaml/acceptance.lock.json and a real Factory.mark_spec_ready/record
      transition sequence — not by spinning up a real live-canary provider that actually attempts
      an out-of-policy network call. Does not yet wire this check into any live M1-M5 product
      pipeline (no product milestone has gone through mark_spec_ready with a real network_policy
      yet) — same "not yet wired to a real pipeline" scope note as F021/F023.

