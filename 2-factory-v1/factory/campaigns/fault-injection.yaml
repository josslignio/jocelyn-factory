  - id: F016
    title: reviewer indisponible
    status: PASS
    mechanism: >
      factory/bin/factoryctl.py::Factory._require_runtime_sha_agreement, Factory.infra_failure,
      Factory.promote
    real_gap_found_and_fixed: >
      Order rule 2: "le provider qui a écrit un candidat ne peut pas être reviewer indépendant de
      ce candidat." Order §5.6: "Reviewer indisponible → provider indépendant préqualifié, sinon
      WAITING_INFRA." F009's fix made _require_runtime_sha_agreement fail closed when NO provider
      (builder/z/codex) had ever recorded a matching runtime SHA — but it still counted "builder"
      itself towards satisfying that check, even though builder is the writer of the very
      candidate under review. A milestone could therefore reach sha_accepted — and pass
      promote()'s pre-merge gate — purely on builder's own self-verification, with no independent
      reviewer (z/codex) ever having run at all. verify_factory_dod.py::_check_builder_neq_reviewers
      already names this exact invariant ("builder != reviewers ... at least one non-builder
      reviewer actually ran") but only checks it as a periodic, after-the-fact DoD audit
      (--scope full, run after M0/M1/M3/M5) — never as a fail-closed gate at the actual moment of
      promotion. Fixed: added INDEPENDENT_REVIEW_PROVIDERS (RUNTIME_PROVIDERS minus "builder");
      _require_runtime_sha_agreement now requires at least one independent provider (z or codex)
      to have recorded a matching runtime SHA before sha_accepted. When missing, it routes through
      the existing infra_failure() mechanism (30s/120s/300s backoff, blocked_infra after 3
      retries — the same mechanism every other infra-unavailability path already uses) rather than
      a bare INVALID_REVIEW, since a genuinely unavailable independent reviewer is a retriable
      infra condition per order §5.6, not proof of tampering. Builder verifying IN ADDITION to an
      independent reviewer is unaffected — the fix only rejects builder acting alone.
